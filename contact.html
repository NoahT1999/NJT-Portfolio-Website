<html>
    <head>
        <meta charset="utf-8">
        <meta http-equiv="X-UA-Compatible" content="IE=edge">
        <title>About</title>
        <meta name="description" content="">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <link rel="stylesheet" href="stylesheet.css">
    </head>
    <body>
        <!--[if lt IE 7]>
            <p class="browsehappy">You are using an <strong>outdated</strong> browser. Please <a href="#">upgrade your browser</a> to improve your experience.</p>
        <![endif]-->
        <video playsinline autoplay muted loop id="bgvid">
            <source id="videoSource" src="" type="video/mp4">
        </video>
        <div class="overlay"></div>
        <header>
            <a href="index.html" alt="Home page" class = "homeButton">
                <h1 id="homepageTitle">NJT Designs</h1>
            </a>
        </header>
        <div class="contactPageContainer">
            <h1 class="pageContainerTitle">Contacts</h1>
            <p>Email: turn4764@vandals.uidaho.edu</p>
            <p>Phone: (123) 456-7890</p>
            <h2 class="pageContainerTitle">Contacts Form</h2>
            <div class="field">
               <label for="contact-name">Name</label>
               <br>
               <input
                  id="contact-name"
                  name="name"
                  type="text"
                  placeholder="Your name"
                  autocomplete="name"
                  required
               />
            </div>
            <form id="contact-form" action="#" method="post">
            <div class="field">
               <label for="contact-email">Email</label>
               <br>
               <input
                  id="contact-email"
                  name="email"
                  type="email"
                  placeholder="you@example.com"
                  autocomplete="email"
                  required
                  />
            </div>
            <div class="field">
               <label for="contact-reason">Reason for contacting</label>
               <br>
               <textarea
                  id="contact-reason"
                  name="reason"
                  rows="6"
                  placeholder="Tell me about your reason for reaching out"
                  required
               ></textarea>
            </div>
            <button type="submit">Send</button>
         </form>
         <h2>Location</h2>
         <iframe
            title="Map of Antarctica"
            width="100%"
            height="420"
            style="border:0; border-radius:12px;"
            loading="lazy"
            referrerpolicy="no-referrer-when-downgrade"
            src="https://www.google.com/maps?q=Antarctica&hl=en&z=3&output=embed">
         </iframe>
        </div>
        
        <div class="footer">
            <a href = "TermsAndConditions.html" class = "homepageLinks">
                <h3 class="footerText">Terms and Conditions</h3>
            </a>
            <a href = "PrivacyPolicy.html" class = "homepageLinks">
                <h3 class="footerText">Privacy Policy</h3>
            </a>
            <a href = "CookiePolicy.html" class = "homepageLinks">
                <h3 class="footerText">Cookie Policy</h3>
            </a>
        </div>
        <script src="otherpages.js" defer></script>
    </body>
